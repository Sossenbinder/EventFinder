name: CI / CD

# Test everything, then (on main only) build and push the image. ArgoCD in the
# HKube repo pulls ghcr.io/sossenbinder/eventfinder:latest, so pushing the image
# is the deploy -- there is no ssh step.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/sossenbinder/eventfinder

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore EventFinder.slnx
      - name: Build
        run: dotnet build EventFinder.slnx --no-restore -c Release
      - name: Test
        run: dotnet test EventFinder.slnx --no-build -c Release --verbosity normal

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend
        run: npm ci
        working-directory: web
      - name: Build frontend
        run: npm run build
        working-directory: web

  build-push:
    # Only build/push a real image off main (or a manual run) -- never for PRs.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
