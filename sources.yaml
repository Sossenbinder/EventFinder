# EventFinder source registry.
#
# Every entry here was proven fetchable AND parseable before it was committed
# (AGENTS.md's registry-honesty rule). Never add a URL you have not verified.
# A source with zero upcoming events is still a valid entry — plenty of real
# user groups go quiet over the summer and wake up again in September.
#
# Verified 2026-07-26 against live endpoints.
sources:
  # --- GDG / gdg.community.dev sitemap -------------------------------------
  # Replaces the old Bevy JSON-API adapter: gdg.community.dev's robots.txt
  # disallows /api/ (the path that adapter used) with Crawl-delay: 2. This
  # adapter instead walks /sitemap.xml's monthly sitemap-events-YYYY-MM.xml
  # sub-sitemaps and reads each event's schema.org JSON-LD, keeping only
  # events whose URL matches one of the German chapter slugs below.
  - id: gdg-bevy-de
    org: Google Developer Groups
    type: gdg-sitemap
    url: "https://gdg.community.dev/sitemap.xml"
    region: DE
    tags: [gdg, google, cloud, android, ai]
    enabled: true
    slugs:
      - gdg-aachen
      - gdg-ahlen
      - gdg-berlin
      - gdg-berlin-android
      - gdg-berlin-golang
      - gdg-bgl
      - gdg-black-forest
      - gdg-bodensee
      - gdg-braunschweig
      - gdg-cloud-berlin
      - gdg-cloud-munich
      - gdg-erlangen
      - gdg-hamburg
      - gdg-hannover
      - gdg-heilbronn-1
      - gdg-karlsruhe
      - gdg-munich
      - gdg-munich-android
      - gdg-munich-gophers
      - gdg-munster
      - gdg-nuremberg
      - gdg-on-campus-brandenburg-university-of-technology-cottbus-senftenberg-cottbus-germany
      - gdg-on-campus-constructor-university-bremen-germany
      - gdg-on-campus-frankfurt-school-of-finance-management-frankfurt-germany
      - gdg-on-campus-goethe-university-frankfurt-germany

